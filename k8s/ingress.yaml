apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: apex-redirect
  namespace: fsight
spec:
  redirectRegex:
    regex: ^https://fsight\.fr/(.*)
    replacement: https://www.fsight.fr/${1}
    permanent: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fsight-ingress
  namespace: fsight
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - fsight.fr
        - www.fsight.fr
      secretName: fsight-tls
  rules:
    - host: www.fsight.fr
      http:
        paths:
          - path: /search
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8000
          - path: /dates
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fsight-apex-redirect
  namespace: fsight
  annotations:
    # Pas d'annotation cert-manager ici : le certificat (SAN fsight.fr + www.fsight.fr)
    # est déjà émis par l'Ingress fsight-ingress et partagé via le même secretName.
    traefik.ingress.kubernetes.io/router.middlewares: fsight-apex-redirect@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - fsight.fr
      secretName: fsight-tls
  rules:
    - host: fsight.fr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
